[package]
name = "second-name"
version = "0.1.0"
description = "Second Name: a poetry submission desk"
edition = "2021"
publish = false

[lib]
name = "second_name_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2"
