<html lang="en">

<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#172033; --mute:#5b6478; --line:#dde3ec; --soft:#f4f6f9;
  --accent:#2d5c8c; --accent-ink:#ffffff; --pay:#a9324e; --pay-ink:#ffffff; --ok:#1f7a5c; --ok-bg:#e3f2ec; --warn:#8a5a00; --warn-bg:#fbf0d6; --bad:#a9324e; --bad-bg:#f9e4e9;
  --k-mem:#dbe6f6; --k-self:#e6def3; --k-body:#d3ece6; --k-threat:#f4dbe0; --k-reason:#f5e8cc;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111622; --card:#1a2131; --ink:#e8ecf4; --mute:#9ba6bb; --line:#2b3448; --soft:#202839;
    --accent:#7fb0e0; --accent-ink:#0f1a28; --pay:#e0617d; --pay-ink:#1a0d12; --ok:#5fc7a0; --ok-bg:#15372c; --warn:#e3a94a; --warn-bg:#3b2e12; --bad:#ec7f98; --bad-bg:#4a1f2b;
    --k-mem:#233556; --k-self:#35295a; --k-body:#1c4a40; --k-threat:#582636; --k-reason:#54431b;
  }
}
:root[data-theme="dark"]{
  --bg:#111622; --card:#1a2131; --ink:#e8ecf4; --mute:#9ba6bb; --line:#2b3448; --soft:#202839;
  --accent:#7fb0e0; --accent-ink:#0f1a28; --pay:#e0617d; --pay-ink:#1a0d12; --ok:#5fc7a0; --ok-bg:#15372c; --warn:#e3a94a; --warn-bg:#3b2e12; --bad:#ec7f98; --bad-bg:#4a1f2b;
  --k-mem:#233556; --k-self:#35295a; --k-body:#1c4a40; --k-threat:#582636; --k-reason:#54431b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:620px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
h1{font:600 30px/1.1 "Newsreader",Georgia,serif;margin:0;letter-spacing:-.01em}
.top .meta{font-size:13px;color:var(--mute);text-align:right;line-height:1.35}
h2{font:600 22px/1.2 "Newsreader",Georgia,serif;margin:0}
h3{font:500 13px/1.3 "Instrument Sans",sans-serif;color:var(--mute);margin:18px 0 8px;letter-spacing:.01em}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
.card.tap{width:100%;text-align:left;color:var(--ink);display:block}
.card.tap:active{background:var(--soft)}
.sub{font:italic 400 15px/1.35 "Newsreader",Georgia,serif;color:var(--mute);margin:3px 0 0}
.line{font-size:14px;color:var(--mute);margin-top:6px}
.between{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.plain{background:var(--soft);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px;min-height:40px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:500;padding:0 14px;min-height:44px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-size:15px;min-height:44px;padding:0 4px;margin:0 0 4px -4px}
a{color:var(--accent)}

label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input.f,textarea.f{width:100%;font:16px/1.4 "Instrument Sans",sans-serif;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea.f{min-height:120px;resize:vertical}
textarea.f.poem{font:17px/1.5 "Newsreader",Georgia,serif;min-height:260px}
.help{font-size:13px;color:var(--mute);margin-top:6px}

.steps{list-style:none;padding:0;margin:8px 0 0}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:7px 0}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.steps li.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps li.done span.t{color:var(--mute);text-decoration:line-through}

.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{display:flex;gap:10px;font-size:14px;padding:4px 0;align-items:flex-start}
.checks .i{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.checks li.good .i{background:var(--ok-bg);color:var(--ok)} .checks li.bad .i{background:var(--bad-bg);color:var(--bad)}

.packet{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.packet summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;align-items:center;background:var(--soft);min-height:44px}
.packet summary::-webkit-details-marker{display:none}
.packet pre{margin:0;padding:14px;white-space:pre-wrap;word-wrap:break-word;font:15.5px/1.5 "Newsreader",Georgia,serif;max-height:60vh;overflow:auto;border-top:1px solid var(--line)}

.approve{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4;min-height:44px;padding:8px 0;color:var(--ink)}
.approve input{width:24px;height:24px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.pay{width:100%;margin-top:8px;border:0;border-radius:14px;background:var(--pay);color:var(--pay-ink);font-size:18px;font-weight:600;min-height:56px}
.pay:disabled{opacity:.4;cursor:not-allowed}
.finish{border:2px solid var(--pay);border-radius:16px;padding:16px;margin-top:12px;background:var(--card)}

.path{list-style:none;margin:8px 0 0;padding:0}
.path li{border-radius:12px;padding:10px 12px;margin-bottom:6px;color:var(--ink)}
.path li strong{display:block;font-weight:600;font-size:15px}
.path li span{font-size:14px;opacity:.85}
.path li[data-k="mem"]{background:var(--k-mem)} .path li[data-k="self"]{background:var(--k-self)}
.path li[data-k="body"]{background:var(--k-body)} .path li[data-k="threat"]{background:var(--k-threat)}
.path li[data-k="reason"]{background:var(--k-reason)}

.empty{color:var(--mute);text-align:center;padding:22px 12px;font-size:15px}
.gauge{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.gauge b{display:block;height:100%;background:var(--ok)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav[hidden]{display:none}
nav .in{display:flex;width:100%;max-width:620px}
nav button{flex:1;border:0;background:transparent;color:var(--mute);font-size:12.5px;font-weight:500;min-height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--accent);background:var(--soft)}
nav .dot{position:absolute;margin:-2px 0 0 26px;width:8px;height:8px;border-radius:50%;background:var(--pay)}

.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:92%;padding:12px 14px;border-radius:16px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;font-family:"Newsreader",Georgia,serif;font-size:17px}
.composer{position:sticky;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px}
.composer textarea.f{min-height:64px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:-4px 0 14px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font-size:15px;font-weight:500;min-height:40px;border-radius:9px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h3.month{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 8px;margin:6px 0 4px;font:600 17px/1.2 "Newsreader",Georgia,serif;color:var(--ink);z-index:2}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ev.past{opacity:.55}
.ev .day{flex:none;width:52px;text-align:center;border-radius:10px;padding:6px 0;background:var(--soft)}
.ev .day b{display:block;font:600 22px/1 "Newsreader",Georgia,serif}
.ev .day span{font-size:11px;color:var(--mute)}
.ev.opens .day{background:var(--ok-bg)} .ev.opens .day b{color:var(--ok)}
.ev.closes .day{background:var(--bad-bg)} .ev.closes .day b{color:var(--bad)}
.ev.free .day{background:var(--warn-bg)} .ev.free .day b{color:var(--warn)}
.evb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.evt{font-size:16px;font-weight:600}
.addcal{font-size:13px;margin-top:8px;min-height:32px;display:inline-flex;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:14px;padding:10px 14px;border-radius:12px;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<nav aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var KEY = "second-name-desk-v2";
  var KINDS = {mem:"Memory", self:"Self", body:"Body", threat:"Threat", reason:"Reasoning"};
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var seed = {
    tab:"desk", budget:25, maxQueue:5, lead:60, name:"", bio:"",
    pitch:"",
    poems:[],
    // Verified Oct 4, 2026 against each venue's own submission page unless the note says otherwise. Re-check before paying.
    venues:[
      {id:"v11", name:"Rattle", url:"https://rattle.submittable.com/submit", fee:0, start:"", end:"", tags:"general", maxPoems:4, pays:"$200 print, $100 online", ai:"No AI-generated work", checked:"2026-10-04", notes:"Free year-round. Up to 4 poems. Every free submission is also considered for the $2,000 Neil Postman Award. Wants a personal note about who you are."},
      {id:"v12", name:"Palette Poetry (Featured)", url:"https://palettepoetry.submittable.com/submit", fee:0, start:"", end:"", tags:"general", maxPoems:3, pays:"$50 per poem", ai:"No AI-produced work", checked:"2026-10-04", notes:"Featured Poetry is always free and open year-round. Quick-response option for writers of historically marginalized identities."},
      {id:"v13", name:"Frontier Poetry (New Voices)", url:"https://frontier.submittable.com/submit/79694/new-voices-free", fee:0, start:"", end:"", tags:"general", maxPoems:5, pays:"$50 per poem, up to $150", checked:"2026-10-04", notes:"Free, year-round, for poets with no more than one full-length collection. Up to 5 poems in one document, 10 pages max. Free fast-response option for BIPOC poets."},
      {id:"v14", name:"Waxwing", url:"https://waxwing.submittable.com/submit", fee:0, start:"10-01", end:"11-30", tags:"general, experimental", maxPoems:3, checked:"2026-10-04", notes:"Free, but capped at 300 submissions a month across all genres, so submit on the 1st. Poetry opens in set months (their page currently lists October, November, April and May). Does not pay."},
      {id:"v15", name:"Beloit Poetry Journal", url:"https://www.bpj.org/submit/regular-guidelines", fee:0, start:"01-01", end:"01-31", tags:"general", maxPoems:3, checked:"2026-10-04", notes:"Free open reading periods Jan 1-31 and Jul 1-31, capped at 800 per period. One submission per period. Enjoys long poems."},
      {id:"v16", name:"Litmosphere", url:"https://litmosphere.charlottelit.org/submissions", fee:0, start:"01-01", end:"01-31", tags:"general", maxPoems:5, pays:"Pays (amount on their page)", checked:"2026-10-04", notes:"Free, January for the spring issue and July for fall. Up to 5 poems. Describes itself as 'for lovers of image and metaphor, as curious about inner experience as driving narrative'."},
      {id:"v17", name:"Sugar House Review", url:"https://sugarhousereview.submittable.com/submit", fee:3.75, start:"01-31", end:"07-31", tags:"general", maxPoems:5, checked:"2026-10-04", notes:"Utah's independent poetry journal (Cedar City). Fast-track $3.75 Jan 31 to Jul 31 with a 60-day response. Subscribers can submit any time.", waiver:{kind:"window", start:"08-31", end:"09-30", note:"Free regular submissions Aug 31 to Sep 30 each year, capped at 300 a month (about 6-month response)."}},
      {id:"v1", name:"P-QUEUE", url:"https://pqueue.wordpress.com/volume-21-call-for-papers/", fee:0, start:"09-01", end:"02-01", tags:"experimental, interdisciplinary, general", maxPoems:3, checked:"2026-09-30", notes:"Poetry and prose, cross-genre, theory, experimental. Pays one print copy. Window per Heavy Feather Review's list; confirm on their page."},
      {id:"v2", name:"ANMLY", url:"https://anmly.submittable.com/submit", fee:3, start:"10-01", end:"02-01", tags:"experimental, general", maxPoems:5, ai:"No AI-generated or AI-assisted writing", checked:"2026-10-04", notes:"Up to 5 poems in one document, bio in the cover letter field. Over 1,000 poetry submissions a period.", waiver:{kind:"email", email:"editor@anomalouspress.org", note:"Waives the $3 fee for hardship on request, and for Black, Indigenous and Palestinian writers. Email any time during the reading period."}},
      {id:"v6", name:"Allium", url:"https://allium.colum.edu/", fee:3, start:"11-15", end:"01-31", tags:"general", maxPoems:3, checked:"2026-09-30", notes:"Columbia College Chicago. Window and fee per Heavy Feather Review's list; confirm on their page."},
      {id:"v9", name:"Harpur Palate", url:"https://harpurpalate.submittable.com/submit", fee:0, start:"01-01", end:"03-15", tags:"general", maxPoems:3, checked:"2026-10-04", notes:"Free. 1 to 3 poems, 5 pages max, one submission per period. Closes early at 750 poetry submissions, so go on Jan 1. Also open Jul 1 to Oct 15."},
      {id:"v5", name:"Radar Poetry", url:"http://www.radarpoetry.com/", fee:3, start:"11-01", end:"01-01", tags:"experimental, general", maxPoems:3, checked:"2026-09-30", notes:"Per Heavy Feather Review's list: free or $3 option. Confirm on their page.", waiver:{kind:"option", note:"A free submission option exists on their form. Pick it instead of the paid one."}},
      {id:"v7", name:"The Colby Review", url:"https://colbyreview.org/", fee:0, start:"12-01", end:"03-01", tags:"general", maxPoems:3, checked:"2026-09-30", notes:"Per Heavy Feather Review's list. Confirm on their page."},
      {id:"v8", name:"Shō Poetry Journal", url:"https://shopoetryjournal.com/submissions/", fee:3, start:"12-15", end:"03-24", tags:"general", maxPoems:3, checked:"2026-10-04", notes:"30-day response. Reads groups of poems and standalones. One print copy as payment. Dates vary year to year.", waiver:{kind:"window", note:"Always free for U.S. Indigenous poets. Free pop-up windows for BIPOC poets each period, announced on their Substack and Instagram."}},
      {id:"v10", name:"Call Me [Brackets]", url:"https://callmebrackets.net/", fee:0, start:"01-15", end:"04-01", tags:"experimental, general", maxPoems:3, checked:"2026-09-30", notes:"Per Heavy Feather Review's list. Confirm on their page."},
      {id:"v18", name:"Nashville Review", url:"https://as.vanderbilt.edu/nashvillereview/contact/submit", fee:0, start:"01-01", end:"01-31", tags:"general", maxPoems:3, pays:"$25 per poem", checked:"2026-09-30", notes:"Vanderbilt. Opens January and August, pays $25 a poem. Per Heavy Feather Review's list; confirm fee and dates on their page."},
      {id:"v3", name:"december magazine", url:"http://decembermag.org/", fee:2.5, start:"10-01", end:"05-01", tags:"general", maxPoems:3, checked:"2026-09-30", notes:"Per Heavy Feather Review's list. Confirm on their page."},
      {id:"v19", name:"Bagazine", url:"https://forms.gle/2waEV5KUa2xBeo5B7", fee:null, start:"09-02", end:"09-02", tags:"general", maxPoems:3, checked:"2026-10-04", notes:"Takes poetry, fiction, nonfiction and cross-genre work through a Google Form (sign-in required). Its fee, opening date and poem limit aren't stated anywhere public: Heavy Feather Review's list gives only a September 2 deadline, so this is set as a one-day window to remind you. Confirm everything on the form before submitting."},
      {id:"v20", name:"Construction Magazine", url:"http://constructionlitmag.com/submit/", fee:3, start:"", end:"", tags:"general", maxPoems:3, checked:"2026-10-06", autopilot:false, paused:"Kept out of autopilot: its site has been unreachable since Oct 4, 2026. VenueFold checks it weekly and this entry is replaced with a fresh one once the site is back.", notes:"Poetry, fiction, nonfiction, and border and architecture columns. Fee and year-round reading per Heavy Feather Review's list. Its own site has been unreachable since Oct 4, 2026, so it may have closed: open their page before you submit or pay. Poem limit not known."},
      {id:"v4", name:"Poetry International Online", url:"https://poetryinternational.submittable.com/submit", fee:3, start:"", end:"", tags:"general", minPoems:3, maxPoems:5, checked:"2026-10-04", notes:"3 to 5 poems per submission, open until further notice."}
    ],
    queue:[]
  };

  // ---------- state ----------
  var S;
  function migrate(){
    S.tab = S.tab || "desk"; if(["queue","profile"].indexOf(S.tab) > -1) S.tab = S.tab === "queue" ? "desk" : "you";
    S.chat = S.chat || []; S.queue = S.queue || []; S.venues = S.venues || []; S.poems = S.poems || [];
    seed.venues.forEach(function(sv){
      var i = -1; S.venues.forEach(function(v, k){ if(v.id === sv.id) i = k; });
      if(i < 0) S.venues.push(JSON.parse(JSON.stringify(sv)));
      else if(!S.venues[i].userEdited && S.venues[i].source !== "venuefold") S.venues[i] = JSON.parse(JSON.stringify(sv));
    });
    S.poems.forEach(function(p){ p.revs = p.revs || []; p.tags = p.tags || ""; p.author = p.author || ""; p.second = p.second || ""; });
  }
  function load(){
    try { var raw = localStorage.getItem(KEY); if(raw){ S = JSON.parse(raw); migrate(); return; } } catch(e){}
    S = JSON.parse(JSON.stringify(seed));
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
  load();

  // ---------- AI provider (bring your own key) ----------
  // The key lives in its own localStorage entry, never inside S, so "Copy everything" can't include it.
  // It is sent only to the provider's own API, straight from this device.
  var AKEY = "second-name-ai-key", MKEY = "second-name-ai-model";
  var PROVIDERS = {
    anthropic: {
      label:"Anthropic (Claude)", short:"Anthropic", defaultModel:"claude-haiku-4-5-20251001",
      keysUrl:"https://platform.claude.com/settings/keys", billingUrl:"https://platform.claude.com/settings/billing",
      keyHint:"Starts with sk-ant-",
      headers:function(key){ return {"x-api-key":key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true", "content-type":"application/json"}; },
      verifyUrl:"https://api.anthropic.com/v1/models?limit=1",
      // One round: returns {text, calls:[{id,name,input}], stop, assistant} in a common shape.
      call:function(key, model, st, signal){
        var body = {model:model, max_tokens:2000, messages:st.msgs};
        if(st.system) body.system = st.system;
        if(st.tools.length) body.tools = st.tools.map(function(t){ return {name:t.name, description:t.description, input_schema:t.inputSchema}; });
        return aiFetch(this, "https://api.anthropic.com/v1/messages", key, body, signal).then(function(d){

  function importVenues(text, quiet){
    var d; try { d = JSON.parse(text); } catch(e){ toast("That file isn't JSON."); return; }

    var norm = function(n){ return String(n||"").toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]+/g,""); };
    var added = 0, updated = 0, kept = 0;
    list.forEach(function(nv){
      if(!nv || !nv.name) return;
      var i = -1; S.venues.forEach(function(v,k){ if(v.id === nv.id || norm(v.name) === norm(nv.name)) i = k; });
      var clean = {id: nv.id || uid(), name: String(nv.name), url: String(nv.url||""), submitEmail: nv.submitEmail || "", fee: nv.fee == null || nv.fee === "" ? null : +nv.fee || 0, start: nv.start || "", end: nv.end || "", tags: nv.tags || "general", minPoems: nv.minPoems || undefined, maxPoems: +nv.maxPoems || 3, pays: nv.pays, ai: nv.ai, checked: nv.checked, notes: nv.notes || "", waiver: nv.waiver || null, source: "venuefold"};

  function nextDate(md, after){

    if(d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) d = new Date(y+1, +p[0]-1, +p[1]);
    return d;
  }
  function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
  function gcalLink(title, day, details, loc){
    var next = new Date(day.getFullYear(), day.getMonth(), day.getDate()+1);
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + ymd(day) + "/" + ymd(next) + "&details=" + encodeURIComponent(details||"") + (loc ? "&location=" + encodeURIComponent(loc) : "");
  }
  function calendarEvents(){
    var ev = [], today = new Date(); today.setHours(0,0,0,0);
    var horizon = new Date(today.getFullYear(), today.getMonth()+6, 1);
    S.venues.forEach(function(v){
      if(v.start && v.end){
        var o = nextDate(v.start), c = nextDate(v.end), w = winStatus(v);
        if(!w.open && o < horizon) ev.push({d:o, kind:"opens", v:v, title:v.name + " opens", sub: feeText(v) + (v.notes && /cap/i.test(v.notes) ? " · has a cap, submit on day one" : "")});
        if(c < horizon) ev.push({d:c, kind:"closes", v:v, title:v.name + " closes", sub: w.open ? "Open now" : "Closes " + fmtMD(v.end)});
      }
      if(v.waiver && v.waiver.start && v.waiver.end){
        var ws = nextDate(v.waiver.start); if(ws < horizon) ev.push({d:ws, kind:"free", v:v, title:v.name + " free window opens", sub: v.waiver.note || ""});
      }
    });
    S.queue.forEach(function(q){ if(q.status === "sent" && q.sentAt){ var v = byId(S.venues, q.vid); if(v) ev.push({d:new Date(q.sentAt), kind:"sent", v:v, title:"Sent to " + v.name, sub: q.poemIds.map(function(i){ var p = byId(S.poems,i); return p ? p.title : ""; }).join(", ")}); } });
    var floor = new Date(today.getFullYear(), today.getMonth(), 1);
    return ev.filter(function(e){ return e.d >= floor; }).sort(function(a,b){ return a.d - b.d; });
  }

    return [

      "The poems are theirs. You critique; you do not write. Never write, rewrite or complete a poem, a stanza or a line unless the person explicitly asks for that exact thing, and when you do, label it clearly as your suggestion, not theirs. Several venues ban AI-written or AI-assisted work, and the person must always be able to say truthfully which words are theirs. Only save poem text the person gave you; never save text you wrote as a poem. A reading practice they use: give each poem a 'second name', the title a reader would choose for it, which forces selectivity.",

      seg.appendChild(h("button", {role:"radio", "aria-checked":String(OB.provider === k), "aria-selected":String(OB.provider === k), "data-provider":k, text:PROVIDERS[k].label, onclick:function(){ OB.provider = k; OB.result = null; render(); }}));
    });
    c.appendChild(seg);
    if(OB.provider){
      var P = PROVIDERS[OB.provider];
      c.appendChild(h("label", {class:"f", text:"2. Create a key"}));
      c.appendChild(h("a", {class:"btn", id:"keylink", style:"display:inline-flex;align-items:center;text-decoration:none", href:P.keysUrl, target:"_blank", rel:"noopener", text:"Open " + P.short + " API keys page"}));
      c.appendChild(h("div", {class:"help", text:"Sign in, create a key, and copy it. New accounts need a little prepaid credit before the key works."}));
      var kid = uid();
      c.appendChild(h("label", {class:"f", for:kid, text:"3. Paste your key"}));
      var inp = h("input", {class:"f", id:kid, type:"password", autocomplete:"off", autocapitalize:"off", spellcheck:"false", placeholder:P.keyHint, "aria-describedby":"keynote"});
      inp.value = OB.key;
      inp.addEventListener("input", function(){ OB.key = inp.value; OB.result = null; var m = document.getElementById("obresult"); if(m) m.remove(); });
      c.appendChild(inp);
      c.appendChild(h("div", {class:"help", id:"keynote", text:"Your key is stored only on this device. It is sent only to " + P.short + ", never to us or anyone else, and it is never included in \"Copy everything\" or in the app's code."}));
      var vb = h("button", {class:"btn primary wide", id:"verify", style:"margin-top:12px", text: OB.busy ? "Checking…" : "Verify", onclick:function(){
        var key = OB.key.trim(); if(!key || OB.busy){ if(!key) toast("Paste your key first."); return; }
        OB.busy = true; OB.result = null; render();
        verifyKey(OB.provider, key).then(function(res){
          OB.busy = false; OB.result = res.code;
          if(res.code === "ok"){ setAiConf({provider:OB.provider, key:key, verifiedAt:new Date().toISOString()}); OB.key = ""; OB.changing = false; OB.result = null; toast("Key verified. You're set."); }
          render();
        });
      }});
      if(OB.busy) vb.disabled = true;
      c.appendChild(vb);
      if(OB.result){
        var bad = OB.result !== "ok", r = h("div", {class:"chip " + (bad ? "bad" : "ok"), id:"obresult", role:"alert", "data-code":OB.result, style:"white-space:normal;border-radius:12px;padding:10px 12px;margin-top:12px;display:block;font-size:14px"});
        r.textContent = aiMessage(OB.result, OB.provider);
        c.appendChild(r);
        if(OB.result === "no_credit" || OB.result === "rate_limited"){
          var row = h("div", {class:"row", style:"margin-top:8px"});
          row.appendChild(h("a", {class:"btn", style:"display:inline-flex;align-items:center;text-decoration:none", href:P.billingUrl, target:"_blank", rel:"noopener", text:"Open " + P.short + " billing"}));
          row.appendChild(h("button", {class:"btn ghost", text:"Use this key anyway", onclick:function(){ setAiConf({provider:OB.provider, key:OB.key.trim(), verifiedAt:null}); OB.key = ""; OB.changing = false; OB.result = null; render(); }}));
          c.appendChild(row);
        }
      }
    }
    root.appendChild(c);
    if(have) root.appendChild(h("button", {class:"btn ghost wide", text:"Cancel and keep my current key (" + PROVIDERS[have.provider].short + " " + maskKey(have.key) + ")", onclick:function(){ OB.changing = false; OB.key = ""; OB.result = null; render(); }}));
    root.appendChild(h("div", {class:"help", style:"margin-top:12px", text:"Every copilot message is billed to your provider account at their per-token price. The app uses each provider's small, low-cost model unless you change it in You > Advanced. Set a monthly spend limit in your provider account so there are no surprises."}));
  }

  // ---------- nav + render ----------
  var ICONS = {
    desk:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    poems:'<svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M9 12h6M9 16h6"/></svg>',
    venues:'<svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg>',
    you:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    copilot:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>'
  };
  function renderNav(){
    var nav = document.getElementById("nav"); nav.innerHTML = "";
    var readyN = S.queue.filter(function(q){ var v = byId(S.venues,q.vid); return v && q.status !== "sent" && winStatus(v).open; }).length;
    [["desk","Desk"],["poems","Poems"],["copilot","Copilot"],["venues","Dates"],["you","You"]].forEach(function(t){
      var b = h("button", {"aria-selected":String(S.tab === t[0]), "aria-label":t[1], onclick:function(){ go(t[0]); }});
      b.innerHTML = ICONS[t[0]]; b.appendChild(h("span", {text:t[1]}));
      if(t[0] === "desk" && readyN) b.appendChild(h("span", {class:"dot", "aria-hidden":"true"}));
      nav.appendChild(b);
    });
  }
  function render(){
    var root = document.getElementById("main"); root.innerHTML = "";
    var navEl = document.querySelector("nav");
    // Nothing else is shown until a key is connected (or while changing it).
    if(!aiReady() || OB.changing){ navEl.hidden = true; document.getElementById("nav").innerHTML = ""; viewOnboard(root); return; }
    navEl.hidden = false; renderNav();
    if(S.tab === "desk") (U.screen === "review" ? viewReview : viewDesk)(root);
    else if(S.tab === "poems") (U.screen === "poem" ? viewPoem : viewPoems)(root);
    else if(S.tab === "venues") viewVenues(root);
    else if(S.tab === "copilot") viewCopilot(root);
    else viewYou(root);
  }
  render();
  syncVenues();
  if("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
